services:
  neo4j:
    image: neo4j:5-community
    container_name: rtm_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rtm_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=rtm_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  neo4j_data:
  postgres_data: